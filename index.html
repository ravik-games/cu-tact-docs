<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Как подключить шины проверяемой макетки к тестовой системе: схема, распиновка разъёмов и команда запуска тестов.">
<title>Схема подключения шин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: project picker, step bar, one rotated diagram. Outputs of the checked board on the left, inputs on the right, the checked breadboard in the middle. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #e5e9f1;
  --fg: #141a2a;
  --muted: #566079;
  --line: #cfd6e4;
  --in: #2457d6;
  --out: #8a2fb0;
  --focus: #2457d6;
  --mac: #e3e7ef;
  --hole: #b3bccd;
  --panel: #eef1f7;
  --channel: #cdd4e2;
  --font-display: 'Unbounded', 'Onest', system-ui, sans-serif;
  --font-body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121b; --surface: #161b27; --surface-2: #202738; --fg: #e9ecf4; --muted: #9aa3b8;
    --line: #2a3246; --in: #86a7ff; --out: #d8a2f2; --focus: #86a7ff;
    --mac: #1a2132; --hole: #2d3750; --panel: #121826; --channel: #0e131d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121b; --surface: #161b27; --surface-2: #202738; --fg: #e9ecf4; --muted: #9aa3b8;
  --line: #2a3246; --in: #86a7ff; --out: #d8a2f2; --focus: #86a7ff;
  --mac: #1a2132; --hole: #2d3750; --panel: #121826; --channel: #0e131d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--font-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 40px; display: flex; flex-direction: column; gap: 14px; }
h1 { font: 600 clamp(19px, 3.2vw, 26px)/1.2 var(--font-display); margin: 0; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.projs { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.proj { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.proj:hover { background: var(--surface-2); }
.proj[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }

.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.tab { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 8px; border: 1px solid transparent; background: transparent; font-weight: 500; }
.tab:hover { background: var(--surface-2); }
.tab[aria-pressed="true"] { background: var(--surface-2); border-color: var(--line); font-weight: 600; }
.tab.free { color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.in { background: var(--in); } .dot.out { background: var(--out); }
.btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover { opacity: .88; }

.stage { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
#d { display: block; width: 100%; min-width: 760px; height: auto; }

/* diagram */
.b-body { fill: var(--mac); stroke: var(--line); stroke-width: 1.5; }
.b-chan { fill: var(--channel); }
.b-holes { fill: none; stroke: var(--hole); stroke-linecap: round; stroke-width: 6.5; }
.b-rail-b { stroke: #3d6fe0; stroke-width: 2; } .b-rail-r { stroke: #d04a4a; stroke-width: 2; }
.b-wires path { fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.b-chip { fill: #2a2f3b; stroke: #5b6478; stroke-width: 1.2; }
.b-esp { fill: #1b2f4a; }
.b-chipt { font: 600 14px var(--font-mono); fill: #e8ebf2; text-anchor: middle; dominant-baseline: central; letter-spacing: .04em;
  paint-order: stroke; stroke: #2a2f3b; stroke-width: 5px; stroke-linejoin: round; }  /* the label stays readable above the wires */
.b-chipt.esp { stroke: #1b2f4a; }
.b-usb { fill: #c8ccd4; stroke: #8d95a6; }
.b-plate { fill: var(--surface); stroke: var(--line); }
.d-pdot { fill: #4a5163; }
.d-ptxt { font: 700 13px var(--font-mono); fill: #141a2a; text-anchor: middle; dominant-baseline: central; }

.d-panel { fill: var(--panel); stroke: var(--hole); stroke-width: 1.5; stroke-dasharray: 7 5; }
.d-chan { fill: var(--channel); }
.d-rail-b { stroke: #3d6fe0; stroke-width: 2; } .d-rail-r { stroke: #d04a4a; stroke-width: 2; }
.d-mac { fill: var(--mac); stroke: var(--line); stroke-width: 1.5; }
.d-hole { fill: var(--hole); }
.d-cap { font: 600 13px var(--font-body); fill: var(--fg); text-anchor: middle; }
.d-rolebg { fill: var(--surface); stroke-width: 1.3; } .d-rolebg.in { stroke: var(--in); } .d-rolebg.out { stroke: var(--out); }
.d-roletxt { font: 600 12px var(--font-body); text-anchor: middle; dominant-baseline: central; }
.d-roletxt.in { fill: var(--in); } .d-roletxt.out { fill: var(--out); }
.d-leg { font: 600 12px var(--font-body); fill: var(--muted); }
.d-stubbg { fill: #eceff5; stroke: #aeb7ca; stroke-width: 1.2; stroke-dasharray: 5 4; }
.d-stubtxt { font: 500 13px var(--font-body); fill: #6b7488; text-anchor: middle; dominant-baseline: central; }
.d-name { font: 600 21px var(--font-display); fill: var(--fg); text-anchor: middle; }
.d-hous { fill: #fff; stroke: #98a2b8; stroke-width: 1.5; }
.d-sep { stroke: #e3e7ef; stroke-width: 1; }
.d-pin { font: 700 14px var(--font-mono); fill: #141a2a; text-anchor: middle; dominant-baseline: central; }
.d-sig { font: 700 14px var(--font-mono); fill: #141a2a; text-anchor: middle; dominant-baseline: central; }
.d-none { fill: none; stroke: #a5aec0; stroke-width: 1.3; stroke-dasharray: 4 3; }
.d-dash { font: 500 13px var(--font-mono); fill: #7c869b; text-anchor: middle; dominant-baseline: central; }
.d-bus { font: 600 14px var(--font-display); text-anchor: middle; dominant-baseline: central; }
/* "Шина X" is a tab on the plug housing; the housing is always white, so the tab colours do not follow the theme */
.d-tab { fill: #fff; stroke: #98a2b8; stroke-width: 1.5; }
.d-bus.in { fill: #2457d6; } .d-bus.out { fill: #8a2fb0; }
.grp.free .d-tab { fill: #eceff5; stroke: #aeb7ca; }
.grp.free .d-bus { fill: #6b7488; }
.hit { fill: transparent; }
.d-sub { font: 500 12px var(--font-body); fill: var(--muted); }
.d-wu { stroke: #8c96ab; stroke-width: 9; stroke-linecap: round; }
.d-w { stroke: #fff; stroke-width: 6; stroke-linecap: round; }
/* pins without a signal: the cable stays opaque, just greyer */
.d-off .d-wu { stroke: #b2bacb; }
.d-off .d-w { stroke: #eef1f6; }
.d-note { font: 500 13px var(--font-body); fill: var(--muted); text-anchor: middle; }
.flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1 15; animation: flow 1s linear infinite; opacity: 0; }
.flow.in { stroke: var(--in); } .flow.out { stroke: var(--out); }
@keyframes flow { to { stroke-dashoffset: -16; } }
/* nothing here is translucent: unused buses are a bit greyer, only the pin text is dimmed */
.grp { transition: filter .35s; cursor: pointer; }
.grp.free .d-hous { fill: #eceff5; stroke: #aeb7ca; }
.grp.free .d-ptxt, .grp.free .d-dash, .grp.free .d-note { opacity: .6; }
/* another bus is in focus: grey it out instead of fading it */
.grp.off { filter: grayscale(1); }
.grp.off .d-ptxt, .grp.off .d-sig, .grp.off .d-dash, .grp.off .d-note { opacity: .55; }
.grp.act .flow, .grp.hot .flow { opacity: 1; }
.grp.act .rw { animation: rowin .5s both; animation-delay: calc(var(--i) * 50ms); }
@keyframes rowin { from { opacity: .15; transform: translateX(-8px); } to { opacity: 1; transform: none; } }

#d.c { min-width: 0; max-width: 460px; margin: 0 auto; }
.viewbtn { align-self: flex-start; }
@media (max-width: 720px) {
  .wrap { padding-inline: 12px; gap: 12px; }
  .tab { padding: 9px 12px; }
  #play { width: 100%; }
}

/* command generator */
.cmd { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.cmd h2 { font: 600 17px/1.3 var(--font-display); margin: 0; }
.cmd-note { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.cmd-note:empty { display: none; }
.cmd-row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld.grow { flex: 1 1 240px; }
.lbl { font-size: 13px; color: var(--muted); font-weight: 500; }
.cfg { font: 500 14px var(--font-mono); padding: 8px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); overflow-wrap: anywhere; }
.cfg.none { color: var(--muted); font-family: var(--font-body); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
#cmd-port { font: 500 15px var(--font-mono); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
#cmd-port::placeholder { color: var(--muted); }
.flags { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px 20px; }
.flag { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: start; cursor: pointer; padding: 4px 0; }
.flag input { margin: 4px 0 0; width: 16px; height: 16px; accent-color: var(--in); }
.flag b { font: 600 14px var(--font-mono); }
.flag span { grid-column: 2; color: var(--muted); font-size: 13px; line-height: 1.35; }
.fgrp { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px 6px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 20px; }
.fgrp > .gcap { grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-weight: 500; }
.term { display: flex; gap: 12px; align-items: flex-start; background: #0f1420; border-radius: 10px; padding: 12px 12px 12px 16px; }
.term code { flex: 1; min-width: 0; font: 500 14px/1.6 var(--font-mono); color: #e9ecf4; user-select: all; }
.term code span { white-space: nowrap; }
.term code .t-cfg, .term code .t-port, .term code .t-miss { white-space: normal; overflow-wrap: anywhere; }
.term .btn { flex: none; background: #e9ecf4; color: #0f1420; border-color: #e9ecf4; }
.term .btn:hover { opacity: .88; }
.t-dim { color: #8d97ae; } .t-cfg { color: #8fb4ff; } .t-port { color: #ffd479; } .t-flag { color: #7fe3b0; } .t-miss { color: #ff9a8a; }
@media (max-width: 560px) { .term { flex-direction: column; } .term .btn { align-self: stretch; } }

@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
  .grp { transition: none; }
  .grp.act .rw { animation: none; }
}
</style>
</head>
<body>


<div class="wrap">
  <h1>Схема подключения шин</h1>
  <div class="projs" id="projs" role="group" aria-label="Проект"></div>
  <div class="bar">
    <div class="tabs" id="tabs" role="group" aria-label="Шина"></div>
    <button class="btn primary" id="play" type="button" aria-pressed="false">Показать по шагам</button>
  </div>
  <button class="btn viewbtn" id="view" type="button" hidden></button>
  <div class="stage"><svg id="d" viewBox="0 0 1120 1790" role="img" aria-label="Схема подключения шин к проверяемой макетке"></svg></div>
  <section class="cmd" aria-labelledby="cmd-h">
    <h2 id="cmd-h">Команда запуска теста</h2>
    <p class="cmd-note" id="cmd-note"></p>
    <div class="cmd-row">
      <div class="fld"><span class="lbl">Конфиг</span><code class="cfg" id="cmd-cfg"></code></div>
      <div class="fld"><span class="lbl" id="os-l">Операционная система</span><div class="seg" id="cmd-os" role="group" aria-labelledby="os-l"></div></div>
      <div class="fld grow"><label class="lbl" for="cmd-port">Порт</label><input id="cmd-port" type="text" spellcheck="false" autocomplete="off" autocapitalize="off"></div>
    </div>
    <div class="flags" id="cmd-flags"></div>
    <div class="term">
      <code id="cmd-out" aria-live="polite"></code>
      <button class="btn primary" id="cmd-copy" type="button">Скопировать</button>
    </div>
  </section>
</div>

<!--
  Генератор команды запуска (блок под схемой). Всё, что можно захотеть менять, лежит в JSON:

  1) Конфиг схемы: поле "config" у проекта в #projects-data, путь считается от "configDir".
       "config": "semester_1/adder_tests.yaml"   - конфиг есть
       "config": null                            - конфига пока нет (кнопка "Скопировать" отключена)
     Новый проект - просто ещё один объект в #projects-data с полем "config".
  2) Порты по умолчанию и список ОС: "os" в #cmd-data.
  3) Флаги: "flags" в #cmd-data. Флаги с одинаковым "group" взаимоисключающие
     (в "groups" лежит подпись группы). Новый флаг - ещё одна строка {"flag": "...", "desc": "..."}.
-->
<script type="application/json" id="cmd-data">
{
  "python": "python",
  "script": "maket_tester/tester.py",
  "configDir": "maket_tester/configs/",
  "os": [
    { "id": "windows", "name": "Windows", "port": "COM3" },
    { "id": "mac",     "name": "macOS",   "port": "/dev/cu.usbmodem1101" },
    { "id": "linux",   "name": "Linux",   "port": "/dev/ttyACM0" }
  ],
  "groups": {
    "fail": "Если тест упал (без флага решает YAML)"
  },
  "flags": [
    { "flag": "--show-passes",      "desc": "печатать каждый успешный тест" },
    { "flag": "--raw",              "desc": "показывать низкоуровневый обмен" },
    { "flag": "--no-color",         "desc": "отключить ANSI-цвета" },
    { "flag": "--stop-on-fail",     "desc": "остановиться после первого FAIL, игнорируя YAML", "group": "fail" },
    { "flag": "--not-stop-on-fail", "desc": "выполнить все наборы, игнорируя YAML",            "group": "fail" }
  ]
}
</script>

<script>

        if (w < 40) continue;
        var cx = +g.dataset.cx, top = +g.dataset.top, bot = +g.dataset.bot, x0 = cx - w / 2, x1 = cx + w / 2, r = 8;
        g.querySelector('path').setAttribute('d', 'M' + x0 + ' ' + bot + 'V' + (top + r) + 'Q' + x0 + ' ' + top + ' ' + (x0 + r) + ' ' + top +
          'H' + (x1 - r) + 'Q' + x1 + ' ' + top + ' ' + x1 + ' ' + (top + r) + 'V' + bot);
      } catch (e) {}
    }
  }

  function panelHead(cx, role, label) {
    return '<text class="d-cap" x="' + cx + '" y="172">Проверяемая</text><text class="d-cap" x="' + cx + '" y="189">макетка</text>' +
      '<rect class="d-rolebg ' + role + '" x="' + (cx - 34) + '" y="197" width="68" height="20" rx="10"/>' +
      '<text class="d-roletxt ' + role + '" x="' + cx + '" y="207.5">' + label + '</text>';
  }

  function render() {
    var s = '';
    if (compact) {
      s += '<text class="d-leg" x="8" y="16">Проверяемая макетка</text><text class="d-leg" x="384" y="16" text-anchor="end">Тестовая система</text>';
      var T = 34;
      BUSES.forEach(function (b) {
        var g = GROUPS.filter(function (x) { return x.bus === b.id; })[0];
        s += groupSVG(g, geoCompact(b, T + TAB_H + 13));
        T += TAB_H + (isUsed(b) ? HH + 22 : 36 + 14);
      });
      svg.setAttribute('viewBox', '0 0 392 ' + Math.ceil(T));
    } else {
      s += '<rect class="d-panel" x="24" y="150" width="128" height="550" rx="14"/>';
      s += '<rect class="d-panel" x="968" y="150" width="128" height="550" rx="14"/>';
      s += panelHead(88, 'out', 'выходы') + panelHead(1032, 'in', 'входы');
      s += BOARD;
      GROUPS.forEach(function (g) { s += groupSVG(g, geoWide(g)); });
      svg.setAttribute('viewBox', '0 0 1120 1790');
    }
    svg.innerHTML = s;
    fitLabels();
    svg.setAttribute('aria-label', 'Схема подключения шин: ' + PROJECTS[cur].name);
  }

  /* n = bus in focus (0 = all). hover = a preview that follows the mouse and does not change the chosen step */
  function paint(n, hover) {
    BUSES.forEach(function (b) {
      var g = ge('g-' + b.id); if (!g) return;
      g.setAttribute('class', 'grp' + (isUsed(b) ? '' : ' free') + (n === 0 ? '' : n === b.id ? (hover ? ' hot' : ' act') : ' off'));
    });
  }

  function renderProjs() {
    projsEl.innerHTML = PROJECTS.map(function (p, i) {
      return '<button class="proj" type="button" data-i="' + i + '" aria-pressed="' + (i === cur) + '">' + esc(p.name) + '</button>';
    }).join('');
  }
  function renderTabs() {
    var used = usedIds();
    var h = '<button class="tab" type="button" data-step="0" aria-pressed="' + (active === 0) + '">Все шины</button>';
    BUSES.forEach(function (b) {
      var u = used.indexOf(b.id) >= 0;
      h += '<button class="tab' + (u ? '' : ' free') + '" type="button" data-step="' + b.id + '" aria-pressed="' + (active === b.id) + '"><i class="dot ' + b.role + '"></i>Шина ' + b.id + '</button>';
    });
    tabsEl.innerHTML = h;
  }

  function setActive(n) {
    active = n;
    paint(n);
    renderTabs();
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    playBtn.textContent = 'Показать по шагам';
    playBtn.setAttribute('aria-pressed', 'false');
  }
  function selectProject(i) {
    cur = i; stop(); renderProjs(); render(); setActive(0); renderCmd();
    try { location.hash = PROJECTS[i].id; } catch (e) {}
  }

  projsEl.addEventListener('click', function (e) {
    var t = e.target.closest('.proj'); if (t) selectProject(+t.dataset.i);
  });
  tabsEl.addEventListener('click', function (e) {
    var t = e.target.closest('.tab'); if (!t) return;
    stop(); setActive(+t.dataset.step);
  });
  playBtn.addEventListener('click', function () {
    if (timer) { stop(); return; }
    var ids = usedIds(); if (!ids.length) return;
    var n = 0;
    setActive(ids[0]);
    playBtn.textContent = 'Пауза';
    playBtn.setAttribute('aria-pressed', 'true');
    timer = setInterval(function () {
      n++;
      if (n >= ids.length) { stop(); setActive(0); return; }
      setActive(ids[n]);
    }, 4200);
  });


  /* ---------- hover / tap on a bus, phone layout ---------- */
  var viewBtn = ge('view'), mq = window.matchMedia('(max-width: 720px)'), forceWide = false, compact = false;
  var isMouse = function (e) { return !e.pointerType || e.pointerType === 'mouse'; };

  function applyView() {
    compact = mq.matches && !forceWide;
    svg.classList.toggle('c', compact);
    viewBtn.hidden = !mq.matches;
    viewBtn.textContent = compact ? 'Показать полную схему с макеткой' : 'Показать упрощённую схему';
  }
  viewBtn.addEventListener('click', function () { forceWide = compact; applyView(); render(); paint(active); });
  var onMq = function () { forceWide = false; applyView(); render(); paint(active); };
  if (mq.addEventListener) mq.addEventListener('change', onMq); else mq.addListener(onMq);

  svg.addEventListener('pointerover', function (e) {
    if (!isMouse(e)) return;
    var g = e.target.closest && e.target.closest('.grp');
    if (g) paint(+g.dataset.bus, true); else paint(active);
  });
  svg.addEventListener('pointerleave', function (e) { if (isMouse(e)) paint(active); });
  svg.addEventListener('click', function (e) {
    var g = e.target.closest && e.target.closest('.grp'); if (!g) return;
    var id = +g.dataset.bus;
    stop(); setActive(active === id ? 0 : id);
  });
  tabsEl.addEventListener('pointerover', function (e) {
    if (!isMouse(e)) return;
    var t = e.target.closest('.tab'); if (t) paint(+t.dataset.step, true);
  });
  tabsEl.addEventListener('pointerleave', function (e) { if (isMouse(e)) paint(active); });

  /* ---------- command generator ---------- */
  var CMD = JSON.parse(ge('cmd-data').textContent);
  var cmdOS = detectOS(), cmdPort = '', cmdFlags = {};

  function detectOS() {
    var s = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || '';
    var id = /mac|darwin|iphone|ipad/i.test(s) ? 'mac' : /win/i.test(s) ? 'windows' : 'linux';
    return CMD.os.some(function (o) { return o.id === id; }) ? id : CMD.os[0].id;
  }
  function osInfo() { return CMD.os.filter(function (o) { return o.id === cmdOS; })[0]; }
  function shq(s) { return /\s/.test(s) ? '"' + s.replace(/"/g, '\\"') + '"' : s; }

  function renderCmdStatic() {
    ge('cmd-os').innerHTML = CMD.os.map(function (o) {
      return '<button type="button" data-os="' + esc(o.id) + '" aria-pressed="' + (o.id === cmdOS) + '">' + esc(o.name) + '</button>';
    }).join('');
    var h = '', i = 0;
    while (i < CMD.flags.length) {
      var f = CMD.flags[i];
      if (f.group) {
        var inner = '<div class="gcap">' + esc(CMD.groups && CMD.groups[f.group] || '') + '</div>';
        while (i < CMD.flags.length && CMD.flags[i].group === f.group) { inner += flagHTML(CMD.flags[i]); i++; }
        h += '<div class="fgrp">' + inner + '</div>';
      } else { h += flagHTML(f); i++; }
    }
    ge('cmd-flags').innerHTML = h;
    syncPortField();
  }
  function flagHTML(f) {
    return '<label class="flag"><input type="checkbox" data-flag="' + esc(f.flag) + '"' + (cmdFlags[f.flag] ? ' checked' : '') + '><b>' + esc(f.flag) + '</b><span>' + esc(f.desc) + '</span></label>';
  }
  function syncPortField() {
    var inp = ge('cmd-port');
    inp.placeholder = osInfo().port;
    inp.value = cmdPort;
  }

  function cmdParts() {
    var p = PROJECTS[cur], port = (cmdPort.trim() || osInfo().port);
    var parts = [
      { t: CMD.python, c: 'dim' },
      { t: CMD.script, c: 'dim' },
      p.config ? { t: CMD.configDir + p.config, c: 'cfg' } : { t: '[название конфига]', c: 'miss' },
      { t: '--port', c: 'dim' },
      { t: shq(port), c: 'port' }
    ];
    CMD.flags.forEach(function (f) { if (cmdFlags[f.flag]) parts.push({ t: f.flag, c: 'flag' }); });
    return parts;
  }

  function renderCmd() {
    var p = PROJECTS[cur], has = !!p.config;
    var cfg = ge('cmd-cfg');
    cfg.className = 'cfg' + (has ? '' : ' none');
    cfg.textContent = has ? CMD.configDir + p.config : 'пока нет';
    ge('cmd-note').textContent = has ? 'Конфиг подставляется по выбранной схеме: «' + p.name + '».'
      : 'Для схемы «' + p.name + '» конфига пока нет, команду получится собрать, когда он появится.';
    var parts = cmdParts();
    ge('cmd-out').innerHTML = parts.map(function (x) { return '<span class="t-' + x.c + '">' + esc(x.t) + '</span>'; }).join(' ');
    ge('cmd-copy').disabled = !has;
    ge('cmd-copy').style.opacity = has ? '' : '.5';
    ge('cmd-copy').style.cursor = has ? '' : 'not-allowed';
    cmdText = parts.map(function (x) { return x.t; }).join(' ');
  }
  var cmdText = '', copyTimer = null;

  function copyText(s) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s);
    return new Promise(function (ok, fail) {
      var ta = document.createElement('textarea');
      ta.value = s; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? ok() : fail(); } catch (e) { fail(e); }
      document.body.removeChild(ta);
    });
  }

  ge('cmd-os').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    cmdOS = b.dataset.os; cmdPort = '';          /* порт от другой ОС не подходит, берём стандартный */
    renderCmdStatic(); renderCmd();
  });
  ge('cmd-port').addEventListener('input', function (e) { cmdPort = e.target.value; renderCmd(); });
  ge('cmd-flags').addEventListener('change', function (e) {
    var inp = e.target, flag = inp.dataset.flag; if (!flag) return;
    cmdFlags[flag] = inp.checked;
    var f = CMD.flags.filter(function (x) { return x.flag === flag; })[0];
    if (inp.checked && f.group) {                /* флаги одной группы взаимоисключающие */
      CMD.flags.forEach(function (x) { if (x.group === f.group && x.flag !== flag) cmdFlags[x.flag] = false; });
      renderCmdStatic();
    }
    renderCmd();
  });
  ge('cmd-copy').addEventListener('click', function () {
    var btn = ge('cmd-copy');
    if (btn.disabled) return;
    var done = function (txt) {
      btn.textContent = txt; clearTimeout(copyTimer);
      copyTimer = setTimeout(function () { btn.textContent = 'Скопировать'; }, 1800);
    };
    copyText(cmdText).then(function () { done('Скопировано'); }, function () {
      var r = document.createRange(); r.selectNodeContents(ge('cmd-out'));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done('Выделено, нажмите Ctrl+C');
    });
  });

  function fromHash() {
    var id = '';
    try { id = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) {}
    for (var i = 0; i < PROJECTS.length; i++) if (PROJECTS[i].id === id) return i;
    return -1;
  }
  window.addEventListener('hashchange', function () {
    var i = fromHash(); if (i >= 0 && i !== cur) { cur = i; stop(); renderProjs(); render(); setActive(0); renderCmd(); }
  });

  var h0 = fromHash(); if (h0 >= 0) cur = h0;
  renderCmdStatic();
  applyView();
  renderProjs(); render(); setActive(0); renderCmd();
  if (document.fonts) { document.fonts.addEventListener('loadingdone', fitLabels); document.fonts.ready.then(fitLabels); }
})();
</script>

</body></html>
